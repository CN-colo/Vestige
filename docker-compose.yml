services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/vestige-backend:latest  # 加这行
    container_name: vestige-backend
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - DATABASE_URL=sqlite:////app/data/vestige.db
      - UPLOAD_DIR=/app/uploads
      - DEBUG=${DEBUG:-false}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    networks:
      - vestige-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/public/articles')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/vestige-frontend:latest  # 加这行
    container_name: vestige-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vestige-network

volumes:
  backend_data:
    name: vestige-data
  backend_uploads:
    name: vestige-uploads

networks:
  vestige-network:
    name: vestige-network